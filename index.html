<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Feliz Cumpleaños Corazón</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&display=swap"
      rel="stylesheet" />
    <link rel="stylesheet" href="love letter 2.css" />
  </head>
  <body>
    <div class="envlope-wrapper">
      <div id="envelope" class="inicio">
        <div class="front flap"></div>
        <div class="front pocket"></div>
        <div class="letter">
          <div class="words line1">Para: LILI</div>
          <div class="words line2">Holis Chikis paso por aquí para desearte</div>
          <div class="words line3">FELIZ CUMPLEAÑOS</div>
          <div class="words line4">eres alguien increíble y eres muy especial para mi</div>
          <div class="words line5">gracias por formar parte de mi vida.</div>
          <div class="words line6">Te deseo mucha felicidad y éxito</div>
          <div class="words line7">Con todo mi cariño, Alfredo </div>
        </div>
        <div class="hearts">
          <div class="heart a1"></div>
          <div class="heart a2"></div>
          <div class="heart a3"></div>
        </div>
      </div>
    </div>
    <div class="reset">
      <button id="open">Open</button>
      <button id="reset">Close</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="love letter 2.js"></script>
  </body>
</html>
